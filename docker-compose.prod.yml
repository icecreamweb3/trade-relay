services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trade-relay-backend
    restart: unless-stopped
    env_file:
      - path: .env.production
        required: false
    volumes:
      - ./logs:/app/logs
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    container_name: trade-relay-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/trade-relay.conf:/etc/nginx/conf.d/default.conf:ro
