[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "trade-relay"
version = "1.0.0"
description = "Multi-user trading terminal powered by Binance"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "bcrypt>=4.0.0",
    "pyyaml>=6.0",
    "PyMySQL>=1.1.0",
    "python-binance>=1.0.19",
    "python-dotenv>=1.0.0",
]

[project.scripts]
trade-relay = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trade_relay*"]
